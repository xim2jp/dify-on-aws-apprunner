[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log

[program:api]
command=/bin/bash /entrypoint.sh
directory=/app/api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=MODE="api",DIFY_PORT="5100",MIGRATION_ENABLED="true"

[program:worker]
command=/bin/bash /entrypoint.sh
directory=/app/api
autostart=true
autorestart=true
startretries=10
startsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=MODE="worker"

[program:web]
command=node /app-web/web/server.js
directory=/app-web/web
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="3000",HOSTNAME="0.0.0.0",NEXT_PUBLIC_API_PREFIX="/console/api",NEXT_PUBLIC_PUBLIC_API_PREFIX="/api",NEXT_PUBLIC_DEPLOY_ENV="PRODUCTION",EDITION="SELF_HOSTED"

[program:plugin-daemon]
command=/usr/local/bin/run-plugin-daemon.sh
directory=/app/plugin-daemon
autostart=true
autorestart=true
startretries=30
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
